<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — Анализ качества диалогов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Deployment config. For a Dynamics 365 web resource, set apiBase to the service URL.
    window.CQA_CONFIG = Object.assign({ apiBase: "" }, window.CQA_CONFIG || {});
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/conversations">CQA</a>
      <nav>
        <a href="#/conversations" data-nav="conversations"><span class="ico">💬</span>Диалоги</a>
        <a href="#/checklists" data-nav="checklists"><span class="ico">☑</span>Чек-листы</a>
        <a href="#/appeals" data-nav="appeals"><span class="ico">⚖</span>Апелляции <b class="badge" id="appeals-badge" hidden></b></a>
        <a href="#/analytics" data-nav="analytics"><span class="ico">📊</span>Аналитика</a>
        <a href="#/help" data-nav="help"><span class="ico">ℹ</span>Справочник</a>
      </nav>
      <div class="role">
        <label for="role">Роль (демо)</label>
        <select id="role">
          <option value="admin">Администратор</option>
          <option value="lead">Главный специалист</option>
          <option value="operator">Оператор</option>
        </select>
        <a href="#/help" class="small role-help">Что может эта роль?</a>
        <small id="evaluator-info"></small>
      </div>
    </aside>
    <div class="main-col">
      <div class="lang-bar">
        <div class="seg" role="group" aria-label="Язык интерфейса" data-langs data-raw></div>
      </div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
