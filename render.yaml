# Render Blueprint: New + > Blueprint > pick this repo. Creates the web service and a free Postgres.
services:
  - type: web
    name: cqa
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cqa-db
          property: connectionString
      - key: ORG_API_URL          # organizers' GET url without &group_id=... (secret, set in dashboard)
        sync: false
      - key: OPENAI_API_KEY       # NLP evaluator key (secret, set in dashboard; never commit it)
        sync: false
      - key: NLP_MODEL
        value: gpt-6-luna
      - key: TEAM_NAME
        value: ABILITY DRAFT ENJOYERS
      - key: EVAL_WORKERS
        value: "4"
databases:
  - name: cqa-db
    plan: free
    region: frankfurt
