evidence_turns": [15, 18, 25, 26]}, "empathy": {"criterion_id": "empathy", "reasoning": "When the client expressed concern that the delay mattered because stock prices move, the operator offered to have the technical team check the order and promised follow-up (69–71).", "value": true, "evidence_turns": [69, 71]}, "dialogue": {"criterion_id": "dialogue", "reasoning": "The operator initially confused the pending trade order with a personal-details request, so the client had to correct and restate the issue (27–29, 33). The operator later explained the check and follow-up clearly enough to continue.", "value": 7, "evidence_turns": [27, 28, 33, 71, 76]}, "identification": {"criterion_id": "identification", "reasoning": "The operator completed identification and confirmed it was successful before disclosing the order’s status (40–65, 66–68).", "value": true, "evidence_turns": [40, 49, 65, 66, 68]}, "consultation": {"criterion_id": "consultation", "reasoning": "The operator confirmed that the order had been accepted but was still processing, and gave a next step: refer it to the technical team and follow up with the client (66–76).", "value": 20, "evidence_turns": [66, 68, 71, 76]}, "critical": {"criterion_id": "critical", "reasoning": "The operator did not insult the client, offer an outside paid service, or disclose specific account information before identification was confirmed (49, 65–68).", "value": false, "evidence_turns": [49, 65, 66, 68]}}, "p4-ru-002": {"closure": {"criterion_id": "closure", "reasoning": "The operator answered the client's questions and gave a polite goodbye (71).", "value": true, "evidence_turns": [70, 71]}, "contact": {"criterion_id": "contact", "reasoning": "The operator identified the company and gave their name, but did not greet the client in the first reply (3).", "value": false, "evidence_turns": [3]}, "discovery": {"criterion_id": "discovery", "reasoning": "The issue was already clear from the prior conversation and the client's report that the order was rejected; the request for name and address was for connecting with a trader, not for clarifying the need (3, 9, 12).", "value": null, "evidence_turns": [3, 9, 12]}, "empathy": {"criterion_id": "empathy", "reasoning": "The operator remained polite and arranged a consultation after the order was rejected; the client did not express explicit dissatisfaction or distress (12, 15, 60).", "value": true, "evidence_turns": [12, 15, 60]}, "dialogue": {"criterion_id": "dialogue", "reasoning": "The operator warned the client to wait (15), then gave an understandable explanation and answered the follow-up questions (64-69).", "value": 10, "evidence_turns": [15, 64, 66, 68, 69]}, "identification": {"criterion_id": "identification", "reasoning": "The operator discussed general trading conditions for the security, not data specific to the client's account or a protected account action, so identity confirmation was not required (64-69).", "value": null, "evidence_turns": [64, 66, 69]}, "consultation": {"criterion_id": "consultation", "reasoning": "The operator explained that the security cannot be bought through the exchange and can only be traded through an OTC transaction, explained why it appears in the app's order book, and confirmed that an exchange sell order also cannot be placed (64-69).", "value": 20, "evidence_turns": [64, 66, 67, 68, 69]}, "critical": {"criterion_id": "critical", "reasoning": "There is no insult, offer of an outside paid service, or disclosure of confidential account information to the client (64-71).", "value": false, "evidence_turns": [64, 67, 71]}}, "p4-ru-001": {"closure": {"criterion_id": "closure", "reasoning": "The client ended the call in turn 44 before the operator could close it or say goodbye.", "value": null, "evidence_turns": [44, 45]}, "contact": {"criterion_id": "contact", "reasoning": "The operator greeted the client and introduced themselves by name in the first reply (13); the name is garbled but present, and they repeat it in 15 and 17.", "value": true, "evidence_turns": [13, 15, 17]}, "discovery": {"criterion_id": "discovery", "reasoning": "The client's question about what support can provide, including whether it recommends securities, was clear; the operator answered without needing clarification (25–26).", "value": null, "evidence_turns": [25, 26]}, "empathy": {"criterion_id": "empathy", "reasoning": "The client described feeling bounced around and unwelcome (32–34, 41–42); the operator acknowledged understanding and responded to the concern (43).", "value": true, "evidence_turns": [32, 34, 41, 42, 43]}, "dialogue": {"criterion_id": "dialogue", "reasoning": "The operator explained the limits of support and gave an example of technical help when asked; the responses are understandable and no waiting period required a warning.", "value": 10, "evidence_turns": [26, 30, 35, 36, 43]}, "identification": {"criterion_id": "identification", "reasoning": "The discussion concerned general support services; the operator did not disclose account-specific data or perform a protected action.", "value": null, "evidence_turns": [26, 28, 36]}, "consultation": {"criterion_id": "consultation", "reasoning": "The operator explained that support handles technical questions, cannot recommend securities, and that the client would trade independently without a personal manager (26–30, 36, 40).", "value": 20, "evidence_turns": [25, 26, 29, 30, 35, 36, 39, 40]}, "critical": {"criterion_id": "critical", "reasoning": "There are no insults, offers of paid services outside the company, or disclosures of confidential information.", "value": false, "evidence_turns": [26, 43]}}, "p4-ru-005": {"closure": {"criterion_id": "closure", "reasoning": "The operator gave the next step to call after 09:00 and thanked the client for contacting support (44, 51, 72), which serves as a polite closing; the client then confirmed the plan and ended the call (73–74).", "value": true, "evidence_turns": [44, 51, 72, 73, 74]}, "contact": {"criterion_id": "contact", "reasoning": "The first operator reply includes a greeting and an offer to help, but no name is introduced (17).", "value": false, "evidence_turns": [17]}, "discovery": {"criterion_id": "discovery", "reasoning": "The operator asked for the registration phone number, which was relevant to checking the account, and later asked how to address the callers (20, 24); these details had not been provided earlier.", "value": true, "evidence_turns": [19, 20, 24, 25]}, "empathy": {"criterion_id": "empathy", "reasoning": "The operator remained polite and continued trying to guide the client through the registration and account-removal questions; the client expressed confusion but was not dismissed (29–44, 61–71).", "value": true, "evidence_turns": [29, 31, 44, 61, 67, 71]}, "dialogue": {"criterion_id": "dialogue", "reasoning": "The instructions about logging out and waiting were unclear, and the client had to ask repeatedly what to do and when to try again (29–42). The operator eventually gave an understandable next step, so the dialogue was difficult but not wholly incoherent.", "value": 4, "evidence_turns": [29, 31, 33, 35, 36, 40, 42, 44]}, "identification": {"criterion_id": "identification", "reasoning": "The operator discussed removing the specific brokerage account and gave account-related guidance, but the transcript shows no identity verification; providing a phone number and names is not itself confirmation.", "value": false, "evidence_turns": [20, 21, 25, 29, 30]}, "consultation": {"criterion_id": "consultation", "reasoning": "The operator explained that the client should call the support line after 09:00 to check whether the account can be removed, then register again; the operator also answered that registration should use the Kyrgyz passport and Kazakhstan residence can be added afterward (44, 51, 67, 71).", "value": 20, "evidence_turns": [44, 51, 66, 67, 71]}, "critical": {"criterion_id": "critical", "reasoning": "The operator did not insult the client, offer a paid service outside the company, or disclose clear confidential information such as account balances or transactions (17–72).", "value": false, "evidence_turns": [17, 29, 44, 67, 71]}}, "p4-ru-004": {"closure": {"criterion_id": "closure", "reasoning": "The client ended the call at turn 114 before the operator could close it; the operator's follow-up question in 115 is not a goodbye.", "value": null, "evidence_turns": [114, 115]}, "contact": {"criterion_id": "contact", "reasoning": "In the operator's first reply, they greeted the client and introduced themselves by name (15); the name is masked in the transcript.", "value": true, "evidence_turns": [15]}, "discovery": {"criterion_id": "discovery", "reasoning": "The operator asked which bonds the client meant and requested the ticker, which was relevant because the client had not identified the specific bond (30, 32, 34).", "value": true, "evidence_turns": [19, 30, 32, 34]}, "empathy": {"criterion_id": "empathy", "reasoning": "The client explained that discussing the matter at work around colleagues was uncomfortable (29, 41), but the operator did not acknowledge this concern and continued with account-verification questions.", "value": false, "evidence_turns": [29, 41, 47, 51]}, "dialogue": {"criterion_id": "dialogue", "reasoning": "The operator's explanation was mostly understandable, but the client repeatedly asked whether they would have to email for every purchase, and the operator answered with general options rather than directly clarifying the frequency.", "value": 7, "evidence_turns": [96, 97, 98, 101, 103, 111, 112]}, "identification": {"criterion_id": "identification", "reasoning": "The operator requested an SMS code (71), the client provided it (75), and only then did the operator disclose account-specific information about the client's order (79).", "value": true, "evidence_turns": [71, 75, 79]}, "consultation": {"criterion_id": "consultation", "reasoning": "The operator explained that the client could not place this bond order independently and gave the next steps of contacting traders by phone or email (90, 94, 112). However, the repeated question about whether this was necessary for each purchase was not answered explicitly.", "value": 15, "evidence_turns": [90, 94, 97, 103, 111, 112]}, "critical": {"criterion_id": "critical", "reasoning": "No insult or offer of a paid outside service is present, and the account-specific order information was disclosed after the client provided the requested SMS code.", "value": false, "evidence_turns": [71, 75, 79, 90]}}}, "briefs": {}, "tr": {"Қазір қай тарифте тұрғанымды қайдан көремін?": "Где мне посмотреть, на каком я сейчас тарифе?", "Сәлеметсіз бе! Мен AIM, Freedom Broker компаниясының жасанды интеллект көмекшісімін. Өнімдер мен қызметтер туралы сұрақтарға жауап бере аламын, шоттарыңыз, активтеріңіз және комиссиялар туралы ақпарат бере аламын, деректерді кестеде салыстыра аламын, менеджеріңіздің байланыс деректерін жібере аламын және сұрағыңызды қолдау қызметіне жолдай аламын.": "Здравствуйте! Я AIM, ИИ-ассистент компании Freedom Broker. Могу отвечать на вопросы о продуктах и услугах, давать информацию о ваших счетах, активах и комиссиях, сравнивать данные в таблице, отправлять контакты вашего менеджера и передавать ваш вопрос в службу поддержки.", "Әңгімені жалғастыра отырып, дербес деректеріңіздің жиналуына және өңделуіне келісесіз әрі компанияның Құпиялылық саясатымен танысқаныңызды растайсыз.": "Продолжая разговор, вы соглашаетесь на сбор и обработку персональных данных и подтверждаете, что ознакомились с Политикой конфиденциальности компании.", "Тариф брокер есебінің бірінші бетінде көрсетіледі.": "Тариф указан на первой странице отчёта брокера.", "Мен компьютердемін. Операторға қосыңызшы.": "Я за компьютером. Подключите, пожалуйста, оператора.", "Сізді операторға қосайын ба?": "Подключить вас к оператору?", "Иә, қосыңызшы": "Да, подключите", "Күте тұрыңыз, оператор жақында чатқа қосылады.": "Подождите, оператор скоро подключится к чату.", "Чат операторға жіберілді.": "Чат передан оператору.", "Сәлеметсіз бе, менің атым Аружан. Веб-нұсқада «Кабинет» бөлімін ашыңыз. Тариф аты-жөніңіздің астында жазылады.": "Здравствуйте, меня зовут Аружан. Откройте в веб-версии раздел «Кабинет». Название тарифа написано под вашим именем.", "Көрдім, рақмет.": "Увидел, спасибо.", "Оқасы жоқ. Сау болыңыз!": "Пожалуйста. До свидания!", "Брокерлік шотқа банк арқылы ақша аударғым келеді. Деректемелер қайда?": "Хочу перевести деньги на брокерский счёт через банк. Где реквизиты?", "Оларды Freedom Broker қосымшасынан жүктей аласыз.": "Вы можете скачать их в приложении Freedom Broker.", "Қосымша ашық тұр, таба алмадым. Операторға қосыңызшы.": "Приложение открыто, не нашёл. Подключите оператора.", "Иә, рақмет": "Да, спасибо", "Сәлеметсіз бе! Мен Нұрланмын. «Меню → Пополнить → Перевод по реквизитам» деген жолмен өтіңіз.": "Здравствуйте! Я Нурлан. Пройдите по пути «Меню → Пополнить → Перевод по реквизитам».", "Маған теңгемен керек.": "Мне нужно в тенге.", "Қажетті валютаны таңдап, деректемелерді жүктеп алыңыз. Аударым жасарда сол деректемелерді банкке бересіз.": "Выберите нужную валюту и скачайте реквизиты. При переводе передадите эти реквизиты в банк.", "Таптым.": "Нашёл.", "Жақсы. Күніңіз сәтті өтсін!": "Хорошо. Хорошего вам дня!", "Кеше шотқа ақша аудардым, әлі көрінбей тұр.": "Вчера перевёл деньги на счёт, до сих пор не отображаются.", "Сізге аудару нұсқаулығы керек пе, әлде жіберілген төлемді тексергіңіз келе ме?": "Вам нужна инструкция по переводу или хотите проверить уже отправленный платёж?", "Жіберіп қойдым. Адаммен сөйлестіріңізші.": "Уже отправил. Соедините с человеком.", "Иә": "Да", "Банк жағында аударым жіберілді деп тұр.": "В банке написано, что перевод отправлен.", "Сәлеметсіз бе, мен Дана. Ақша көрінбей қалса, алаңдайтыныңыз түсінікті. Нақты төлемді тексеру үшін жеке басыңызды растау қажет.": "Здравствуйте, я Дана. Понятно, что вы беспокоитесь, если деньги не отображаются. Для проверки конкретного платежа необходимо подтвердить вашу личность.", "Жарайды, растаймын.": "Хорошо, подтверждаю.", "Клиенттің жеке басы расталды.": "Личность клиента подтверждена.", "Рақмет. Төлем туралы сұрағыңызды мамандарға жолдаймын. Ақшаны қай валютамен аудардыңыз?": "Спасибо. Ваш вопрос по платежу передам специалистам. В какой валюте вы перевели деньги?", "Теңгемен.": "В тенге.", "Аударымның түбіртегін осында жібере салайын ба?": "Отправить сюда квитанцию о переводе?", "Әзірге түбіртекті жібермей тұрыңыз. Алдымен аударымның шамамен қашан жасалғанын айтыңыз.": "Пока квитанцию не отправляйте. Сначала скажите, примерно когда был сделан перевод.", "Кеше кешке жібердім.": "Вчера вечером отправил.", "Уақытын да сұрағыңызға қостым.": "Время я тоже добавил к вашему вопросу.", "Жақсы, чаттан жауап күтемін.": "Хорошо, жду ответа в чате.", "Тағы бір сұрақ, есепті қайдан жүктеймін?": "Ещё вопрос: где скачать отчёт?", "Қосымшадағы «Отчёты и документы» бөлімін ашып, «Отчёт брокера» тармағын таңдаңыз.": "Откройте в приложении раздел «Отчёты и документы» и выберите пункт «Отчёт брокера».", "Есепті бір айға алуға бола ма?": "Можно ли получить отчёт за один месяц?", "Иә, керекті кезеңнің басы мен соңын көрсетіп, есепті жүктеңіз.": "Да, укажите начало и конец нужного периода и скачайте отчёт.", "Жүктелді. Аударым бойынша осы чаттан жауап күтемін.": "Скачалось. По переводу жду ответа в этом чате.", "Жақсы, аударымға қатысты жауапты осында жібереміз. Сау болыңыз!": "Хорошо, ответ по переводу пришлём сюда. До свидания!", "Ақша шығарайын десем, анкетаны жаңарту керек дейді.": "Хочу вывести деньги, а мне говорят, что нужно обновить анкету.", "Мұндай жағдайда «Изменение сведений» тапсырмасын жіберу керек.": "В таком случае необходимо отправить поручение «Изменение сведений».", "Оны қай жерден жіберемін? Операторды қосыңызшы.": "Где его отправить? Подключите оператора.", "Сәлеметсіз бе, мен Айбекпін. «Меню → Поручения → Персональные данные → Изменение сведений» бөлімін ашыңыз.": "Здравствуйте, я Айбек. Откройте «Меню → Поручения → Персональные данные → Изменение сведений».", "Таптым. Жібергеннен кейін бірден ақша шығара аламын ба?": "Нашёл. Смогу ли я сразу после отправки вывести деньги?", "Деректер жаңарып, тапсырма орындалғаннан кейін ақша шығаруға қайта өтінім бере аласыз.": "После обновления данных и исполнения поручения вы сможете заново подать заявку на вывод денег.", "Енді түсінікті, рақмет.": "Теперь понятно, спасибо.", "Сау болыңыз!": "До свидания!", "Деректерді жаңартайын деп едім, қай жерге кірем?": "Хотел обновить данные, куда заходить?", "Ол үшін «Изменение сведений» тапсырмасы бар.": "Для этого есть поручение «Изменение сведений».", "Қай мәзірде екенін түсінбедім. Оператор керек.": "Не понял, в каком оно меню. Нужен оператор.", "Сәлеметсіз бе, мен Мадина. Профильге кіріңіз де, тапсырмалардан іздеңіз.": "Здравствуйте, я Мадина. Зайдите в профиль и поищите в поручениях.", "Профильде ондай бөлім жоқ қой.": "В профиле же нет такого раздела.", "Иә, нақты жолы «Меню → Поручения → Персональные данные → Изменение сведений».": "Да, точный путь: «Меню → Поручения → Персональные данные → Изменение сведений».", "Енді таптым.": "Теперь нашёл.", "Жақсы.": "Хорошо.", "Өткен жылға брокер есебі керек болып тұр.": "Мне нужен брокерский отчёт за прошлый год.", "Есепті қосымшадағы «Отчёты и документы» бөлімінен жүктей аласыз.": "Отчёт можно скачать в приложении в разделе «Отчёты и документы».", "Күндерін қалай қоямын? Операторға жалғаңызшы.": "Как задать даты? Соедините с оператором.", "Сәлеметсіз бе, мен Әсел. «Отчёт брокера» тармағын ашыңыз. Өткен жылдың басы мен соңын таңдап, есепті жүктеңіз.": "Здравствуйте, я Асель. Откройте пункт «Отчёт брокера». Выберите начало и конец прошлого года и скачайте отчёт.", "Дайын болды. Рақмет!": "Готово. Спасибо!", "Көмегім тигеніне қуаныштымын. Сау болыңыз!": "Рада, что помогла. До свидания!", "Ескі шот жабылған. Жаңасын ашсам, логин бос емес дейді.": "Старый счёт закрыт. Когда открываю новый, пишет, что логин занят.", "Жаңа шот ашу кезінде басқа логинді қолданып көріңіз.": "При открытии нового счёта попробуйте использовать другой логин.", "Ескі логин босай ма деп едім. Оператормен сөйлесейін.": "Я хотел узнать, освободится ли старый логин. Поговорю с оператором.", "Сәлеметсіз бе, менің атым Ермек. Бұрын қолданылған логин шот жабылғаннан кейін де жүйеде қалады. Жаңадан тіркелгенде басқа логин таңдаңыз.": "Здравствуйте, меня зовут Ермек. Использованный ранее логин остаётся в системе даже после закрытия счёта. При новой регистрации выберите другой логин.", "Түсіндім.": "Понял.", "Сайттан жеке кабинетке кіретін жерді таппадым.": "Я не нашёл на сайте вход в личный кабинет.", "Қай сайттан кірмек болып жатырсыз?": "Через какой сайт вы хотите войти?", "Freedom Finance Global сайты. Операторға қосыңызшы.": "Сайт Freedom Finance Global. Подключите оператора.", "Сәлем. Қай сайтқа кірдіңіз?": "Здравствуйте. На какой сайт вы заходили?", "Жоғарыда жаздым ғой, Global сайты.": "Я же выше написал, сайт Global.", "Ол ақпараттық сайт. Сауда шотына tradernet.global веб-нұсқасы немесе Freedom Broker қосымшасы арқылы кіресіз.": "Это информационный сайт. В торговый счёт вы входите через веб-версию tradernet.global или через приложение Freedom Broker.", "Ашылды, рақмет.": "Открылось, спасибо.", "Компанияның атын жазсам, бірнеше қағаз шығады. Қайсысы керек екенін білмедім.": "Когда пишу название компании, выходит несколько бумаг. Не понял, какая нужна.", "Нақты тикері болса, оны «Котировки» бөліміндегі іздеуге жазыңыз.": "Если есть точный тикер, введите его в поиск в разделе «Котировки».", "Тикері бар. Операторға қоса аласыз ба?": "Тикер есть. Можете подключить оператора?", "Тикерді жазып алдым.": "Тикер записал.", "Сәлеметсіз бе! Мен Айсұлумын. Тикерді іздеу жолағына енгізіңіз де, нәтижеден сол тикері бар қағазды ашыңыз.": "Здравствуйте! Я Айсулу. Введите тикер в строку поиска и из результатов откройте бумагу с этим тикером.", "Иә, таптым. Сатып алу үшін ары қарай не істеймін?": "Да, нашёл. Что делать дальше, чтобы купить?", "Сол қағазды таңдап, сатып алу өтінімінің параметрлерін толтырыңыз.": "Выберите эту бумагу и заполните параметры заявки на покупку.", "Түсінікті, көп рақмет.": "Понятно, большое спасибо.", "Менде екі ұқсас қағаз шығады. Біреуінде атауы ұқсас, бірақ тикері басқа.": "У меня выходят две похожие бумаги. У одной название похожее, но тикер другой.", "Сізде нақты тикер болса, соған сәйкес келетін нәтижені ашыңыз.": "Если у вас есть точный тикер, откройте результат, который ему соответствует.", "Аштым. Өтінімді бірден жібергім келмейді, алдымен қарап шығайын.": "Открыл. Заявку сразу отправлять не хочу, сначала посмотрю.", "Жарайды. Параметрлерді қарап шығыңыз. Сатып алуды қаласаңыз ғана өтінімді жіберіңіз.": "Хорошо. Посмотрите параметры. Отправляйте заявку, только если захотите купить.", "Түсіндім. Рақмет!": "Понял. Спасибо!", "Сатып алу өтінімінде «Использовать маржу» тұр. Оны алып тастауға бола ма?": "В заявке на покупку стоит «Использовать маржу». Можно это убрать?", "Бұл параметрді өтінім баптауларынан өшіруге болады.": "Этот параметр можно отключить в настройках заявки.", "Қай жерін басамын? Операторды қосыңызшы.": "Где именно нажать? Подключите оператора.", "Сәлеметсіз бе, мен Алма. Өтінімді жібермей тұрып, «Настройки приказа» тармағын ашып, «Использовать маржу» белгісін алып тастаңыз.": "Здравствуйте, я Алма. Перед отправкой заявки откройте пункт «Настройки приказа» и снимите отметку «Использовать маржу».", "Өшірдім, рақмет.": "Отключил, спасибо.", "D-шот пен сауда шотының айырмасы қандай?": "В чём разница между D-счётом и торговым счётом?", "D-шот жинақтауға, ал сауда шоты бағалы қағаздармен операция жасауға арналған.": "D-счёт предназначен для накоплений, а торговый счёт — для операций с ценными бумагами.", "D-шоттағы ақшамен бірден акция ала аламын ба? Оператор керек.": "Можно ли сразу купить акции на деньги с D-счёта? Нужен оператор.", "Сәлеметсіз бе, мен Саматпын. D-шоттағы қаражат акция сатып алуға тікелей қолданылмайды.": "Здравствуйте, я Самат. Средства на D-счёте напрямую для покупки акций не используются.", "Онда өтінімде сауда шотын қараймын ғой?": "Тогда в заявке я смотрю торговый счёт, да?", "Иә, акция сатып алу үшін сауда шотын қараңыз.": "Да, для покупки акций смотрите торговый счёт.", "Клиентпен байланыс үзілді.": "Связь с клиентом прервалась.", "Облигация сатып алайын десем, өтінім қабылданбай жатыр.": "Хочу купить облигацию, а заявка не принимается.", "Қандай хабарлама шығып тұр?": "Какое сообщение появляется?", "Тек «отклонён» деп тұр. Операторға қосыңызшы.": "Пишет только «отклонён». Подключите оператора.", "Сәлеметсіз бе, мен Дидармын. Қай облигацияны таңдадыңыз? Тикері болса, жазыңыз.": "Здравствуйте, я Дидар. Какую облигацию вы выбрали? Если есть тикер, напишите.", "Қазір іздеп жатырмын.": "Сейчас ищу.", "Жақсы. Тикерді және экрандағы хабарламаны жіберсеңіз, қай өтінім туралы екенін нақтылап, тексеруге жолдай аламын.": "Хорошо. Если пришлёте тикер и сообщение с экрана, я смогу уточнить, о какой заявке идёт речь, и передать на проверку.", "Қазір қолым босамай тұр, кейін жазамын.": "Сейчас руки заняты, напишу позже.", "Жарайды, дайын болғанда осы мәліметтерді жіберіңіз. Сау болыңыз!": "Хорошо, когда будете готовы, отправьте эти данные. До свидания!", "Облигацияларды қайдан қараймын? Бұрын сатып алып көрмедім.": "Где посмотреть облигации? Раньше не покупал.", "«Котировки» бөлімінен атауы не тикері бойынша іздеңіз.": "Ищите в разделе «Котировки» по названию или тикеру.", "Түсіндіріп беретін операторға қосыңызшы.": "Подключите оператора, который объяснит.", "Сәлеметсіз бе, мен Айданамын. «Котировки» бөлімін ашсаңыз, атауы бойынша іздей аласыз.": "Здравствуйте, я Айдана. Если откроете раздел «Котировки», сможете искать по названию.", "Жеке нөміріңізді қалдырсаңыз, жұмыстан кейін хабарласып, қандай қағаз алу керегін ақылы түрде айтып беремін.": "Если оставите личный номер, после работы свяжусь с вами и за плату подскажу, какую бумагу стоит купить.", "Жоқ, рақмет.": "Нет, спасибо.", "Оператор чатты жапты.": "Оператор закрыл чат.", "1042-S нысанын қазақ тілінде алуға бола ма?": "Можно ли получить форму 1042-S на казахском языке?", "1042-S нысаны ағылшын тілінде беріледі.": "Форма 1042-S выдаётся на английском языке.", "Соны оператордан нақтылайыншы.": "Уточню это у оператора.", "Сәлеметсіз бе, мен Ләззатпын. Иә, 1042-S нысаны ағылшын тілінде беріледі.": "Здравствуйте, я Ляззат. Да, форма 1042-S выдаётся на английском языке.", "Жақсы, рақмет.": "Хорошо, спасибо.", "Менің шотымда неге ақша шығару жабық екенін қарап беріңізші.": "Посмотрите, пожалуйста, почему у меня на счёте закрыт вывод денег.", "Нақты шот бойынша тексеру үшін операторға жүгініңіз.": "Для проверки по конкретному счёту обратитесь к оператору.", "Операторға қосыңызшы.": "Подключите оператора.", "Сәлеметсіз бе, мен Мұратпын. Сіздің шотыңызда ақша шығаруға шектеу қойылғанын көріп тұрмын.": "Здравствуйте, я Мурат. Вижу, что на вашем счёте установлено ограничение на вывод денег.", "Мен әлі жеке басымды растаған жоқпын ғой.": "Я же ещё не подтверждал личность.", "Қазір растаудың қажеті жоқ.": "Сейчас подтверждение не требуется.", "Ал себебі қандай?": "А какая причина?", "Оны тексеруге жіберемін. Сау болыңыз.": "Отправлю это на проверку. До свидания."}, "order": ["closure", "contact", "discovery", "empathy", "dialogue", "identification", "consultation", "critical"], "w": {"contact": 10, "discovery": 15, "identification": 20, "consultation": 20, "empathy": 15, "dialogue": 15, "closure": 5}, "max": {"consultation": 20, "dialogue": 10}};
const LB={client:"Клиент",bot:"Бот",operator:"Оператор",system:"Система"};
const NM={contact:"Установление контакта",discovery:"Выявление потребности",identification:"Идентификация",consultation:"Консультация",empathy:"Эмпатия",dialogue:"Ведение диалога",closure:"Завершение",critical:"Грубые нарушения"};
let cur=0,act=D.order[0],onlyBad=false;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fv=(k,v)=>v===null?"N/A":v===true?(k=="critical"?"ДА":"Да"):v===false?(k=="critical"?"нет":"Нет"):String(v);
function agree(a,b,k){if(a===null||b===null)return a===b?1:0;if(D.max[k])return 1-Math.abs(a-b)/D.max[k];return a===b?1:0}
function info(i){const r=D.recs[i],id=r.conversation_id,g=D.gold[id],p=D.pred[id];if(!p)return{mis:0,wa:0,p:null};
 let mis=0,num=0,den=0;for(const c of D.order){const a=agree(g[c],p[c].value,c);if(a<1)mis++;if(D.w[c]){num+=D.w[c]*a;den+=D.w[c]}}return{mis,wa:num/den*100,p}}
function list(){const items=D.recs.map((r,i)=>[i,info(i)]).filter(([i,x])=>!onlyBad||x.mis>0);
 document.getElementById("list").innerHTML=`<h3>Диалоги (${D.recs.length})</h3><label><input type="checkbox" ${onlyBad?"checked":""} onchange="onlyBad=this.checked;list()"> только с расхождениями</label>`+items.map(([i,x])=>`<div class="ci ${i==cur?"act":""}" onclick="cur=${i};render()"><span>${D.recs[i].conversation_id}</span><span>${x.mis?`<b>${x.mis}</b> · `:""}${x.wa.toFixed(0)}</span></div>`).join("")}
function chat(){const r=D.recs[cur],p=info(cur).p,ev=new Set(p?p[act].evidence_turns:[]);
 document.getElementById("chat").innerHTML=`<h2>${r.conversation_id} · ${r.channel} · ${r.language}</h2><p class="help">Оранжевая рамка — реплики-доказательства модели для выбранного справа этапа.</p>`+r.transcript.map((t,i)=>`<div class="t ${t.speaker} ${ev.has(i+1)?"ev":""}"><span class="n">${i+1}</span><span><b>${LB[t.speaker]||t.speaker}</b> <i>${esc(t.timestamp)}</i><br>${esc(t.text)}${D.tr[t.text]?`<div class="tr">🇷🇺 ${esc(D.tr[t.text])}</div>`:""}</span></div>`).join("")}
function side(){const r=D.recs[cur],id=r.conversation_id,x=info(cur),g=D.gold[id],p=x.p;
 let h=`<div id="sum"><div class="big">${x.wa.toFixed(1)}%</div>совпадение модели с разметкой по этому диалогу (с весами чек-листа) · расхождений: <b>${x.mis}</b> из 8. ${D.briefs[id]?`<div class="help">Краткий разбор модели: ${esc(D.briefs[id])}</div>`:""}</div><p class="help">Этапы идут в том порядке, в котором их проходила модель. Для каждого этапа модель сначала пишет обоснование (reasoning), потом значение.</p>`;
 if(!p)return document.getElementById("side").innerHTML=h+"нет ответа модели";
 h+=D.order.map((c,n)=>{const a=agree(g[c],p[c].value,c),m=a>=1;
  return `<div class="st ${m?"mat":"mis"} ${act==c?"act":""}" onclick="act='${c}';chat();side()"><h4><span>Этап ${n+1}: ${NM[c]}</span><span class="w">вес ${D.w[c]||"флаг"}</span></h4><div class="vals"><span>Разметка<b>${fv(c,g[c])}</b></span><span class="m ${m?"":"bad"}">Модель<b>${fv(c,p[c].value)}</b></span>${m?"✓":"✗"}</div><div class="rs">${esc(p[c].reasoning||"")}</div><div class="ev">реплики: ${p[c].evidence_turns.join(", ")}</div></div>`}).join("");
 document.getElementById("side").innerHTML=h}
function render(){list();chat();side()}render();
</script></body></html>
